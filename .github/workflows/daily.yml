name: 每日科学推送
on:
  schedule:
    - cron: "50 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install feedparser requests

      - name: 抓取新闻
        run: python scripts/fetch_news.py

      - name: AI 筛选解读
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scripts/curate.py

      - name: 生成网页
        run: python scripts/build_page.py

      - name: 推送到微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/push.py

      - name: 提交网页与记录
        run: |
          git config user.name "sci-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site data
          git commit -m "daily: $(date +%F)" || echo "nothing to commit"
          git push
